name: Aktien-Bot

# Mo-Fr um 13:45 und 14:45 UTC. 9:30 New York ist je nach Sommerzeit 13:30 oder 14:30 UTC –
# einer der Läufe trifft immer die offene Börse. Der Bot handelt max. 1x pro Tag.
on:
  schedule:
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      modus:
        description: "test = nur prüfen (keine Orders, auch bei geschlossener Börse)"
        type: choice
        options: [test, normal]
        default: test

permissions:
  contents: write

concurrency:
  group: aktien-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Bot laufen lassen
        run: |
          if [ "${{ github.event.inputs.modus }}" = "test" ]; then
            python bot.py --test
          else
            python bot.py
          fi
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
      - name: Logs speichern
        if: always()
        run: |
          git config user.name "aktien-bot"
          git config user.email "aktien-bot@users.noreply.github.com"
          git add -f logs state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Bot-Lauf $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
